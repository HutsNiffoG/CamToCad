[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "camtocad"
version = "0.10.0"
description = "Cam-to-CAD (route A): lokale, open-source pipeline van foto's op een kalibratiemat naar een parametrisch CAD-model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python-headless>=4.10",
    "cadquery>=2.4",
    "pillow>=10",
]

[project.optional-dependencies]
heic = [
    "pi-heif>=1.0",
]
server = [
    "pi-heif>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "segno>=1.5",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pypdfium2>=4",
    "pi-heif>=1.0",
]

[project.scripts]
camtocad = "camtocad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
camtocad = ["server/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end tests that render and reconstruct a synthetic scan"]
