name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Systeembibliotheek voor OpenCascade/VTK
        run: sudo apt-get update && sudo apt-get install -y libgl1
      - name: Installeren
        run: pip install -e ".[server,dev]"
      - name: Lockfile actueel (uv.lock bij pyproject.toml)
        run: pip install "uv==0.8.17" && uv lock --check  # dezelfde uv als de installer-workflow
      - name: Installatie controleren
        run: camtocad doctor --data "$RUNNER_TEMP/camtocad-data"
      - name: Tests
        run: pytest -q -m "not stress"

  stresstest:
    # een kleine stresstest van begin tot eind (ruis, JPEG, vignettering, verscherping), naast de gewone tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Systeembibliotheek voor OpenCascade/VTK
        run: sudo apt-get update && sudo apt-get install -y libgl1
      - name: Installeren
        run: pip install -e ".[server,dev]"
      - name: Stresstest
        run: pytest -q -m stress
