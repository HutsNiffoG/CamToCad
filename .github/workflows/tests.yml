name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Systeembibliotheek voor OpenCascade/VTK
        run: sudo apt-get update && sudo apt-get install -y libgl1
      - name: Installeren
        run: pip install -e ".[server,dev]"
      - name: Tests
        run: pytest -q
